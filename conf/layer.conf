# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# Flatten out the core of the layer's BBFILES list as a specification.  
# done with prior versions of the recipes...
BBFILES += " \
	${LAYERDIR}/recipes-wolf*/*/*.bb \
	${LAYERDIR}/recipes-wolf*/*/*.bbappend \
	${LAYERDIR}/recipes-wolf*/*/*/*.bb \
	${LAYERDIR}/recipes-wolf*/*/*/*.bbappend \
	"

# Conditionally include openssl bbappends when wolfengine is in IMAGE_INSTALL or WOLFSSL_FEATURES.  Wolfengine only applies to 1.x stuff and will break builds if 1.x is NOT available.
# Since we flattened the tree a bit on things, we moved this .bbappend's location accordingly.
BBFILES += "${@'${LAYERDIR}/recipes-support/openssl/openssl_1.%.bbappend' if (bb.utils.contains('WOLFSSL_FEATURES', 'wolfengine', True, False, d) or bb.utils.contains('IMAGE_INSTALL', 'wolfengine', True, False, d)) else ''}"

# Conditionally include openssl bbappends when wolfprovider is in IMAGE_INSTALL or WOLFSSL_FEATURES
BBFILES += "${@'${LAYERDIR}/recipes-wolfssl/wolfprovider/openssl_3.%.bbappend' if (bb.utils.contains('WOLFSSL_FEATURES', 'wolfprovider', True, False, d) or bb.utils.contains('IMAGE_INSTALL', 'wolfprovider', True, False, d)) else ''}"

# Now, handle the Adaptation layer pieces...  Commented out portions MAY be **ooold** and not work right.

# xilinx-bootbin bbappend requires xilinx-tools layerseries.
BBFILES_DYNAMIC += "xilinx-tools:${LAYERDIR}/recipes-bsp/bootbin/*.bbappend"

# Uncomment if building bind with wolfSSL.
#BBFILES += "${LAYERDIR}/recipes-connectivity/bind/*.bbappend"

# Uncomment if building any curl with wolfSSL.
#BBFILES += "${LAYERDIR}/recipes-support/curl/wolfssl_%.bbappend"
# Uncomment if building curl 7.82.0 with wolfSSL (Kirkstone or Newer Syntax).
#BBFILES += "${LAYERDIR}/recipes-support/curl/kirkstone/curl_7.82.0.bbappend"
# Uncomment if building curl 7.82.0 with wolfSSL (Legacy Syntax).
#BBFILES += "${LAYERDIR}/recipes-support/curl/curl_7.82.0.bbappend"
# Uncomment if building any other version of curl with wolfSSL.
#BBFILES += "${LAYERDIR}/recipes-support/curl/curl_%.bbappend"

# Uncomment if building libssh2 with wolfSSL.
#BBFILES += "${LAYERDIR}/recipes-support/libssh2/*.bbappend"

# Uncomment if building net-snmp with wolfSSL.
#BBFILES += "${LAYERDIR}/recipes-protocols/net-snmp/*.bbappend"

# Uncomment if building OpenSSH with wolfSSL.
#BBFILES += "${LAYERDIR}/recipes-connectivity/openssh/*.bbappend"

# Uncomment if building rsyslog with wolfSSL.
#BBFILES += "${LAYERDIR}/recipes-extended/rsyslog/*.bbappend"

# Uncomment if building socat 1.7.3.4 with wolfSSL.
#BBFILES += "${LAYERDIR}/recipes-connectivity/socat/1.7.3.4/*.bbappend"

# Uncomment if building socat 1.8.0.0 with wolfSSL.
#BBFILES += "${LAYERDIR}/recipes-connectivity/socat/1.8.0.0/*.bbappend"

# Uncomment if building strongSwan with wolfSSL.
#BBFILES += "${LAYERDIR}/recipes-support/strongswan/*.bbappend"

# Uncomment if building tcpdump with wolfSSL.
#BBFILES += "${LAYERDIR}/recipes-support/tcpdump/*.bbappend"


# Declare out the BBFILE_COLLECTIONS as wolfssl and then it kind of
# flows from there with almost everything else.
BBFILE_COLLECTIONS += "wolfssl"
BBFILE_PATTERN_wolfssl = "^${LAYERDIR}/"
BBFILE_PRIORITY_wolfssl = "5"
LAYERVERSION_wolfssl = "7"

# We support a HUGE range of distros that span old and new override 
# syntax...so we're going to keep them separated.  Original metatdata
# we used to derive this all from used weak binding to the variablesa
# which is silly.  You're NOT going to override this- it's the config
# and shouldn't be changing as it describes what to do for override
# syntax and what we officially support right now.  User shouldn't be
# changing that as it'll just blow up in their face...
WOLFSSL_LEGACY_SERIES = "sumo thud warrior zeus"
WOLFSSL_MODERN_SERIES = "gatesgarth hardknott honister dunfell kirkstone langdale mickledore nanbield scarthgap wrynose"

# Declare out our support with those two above...
LAYERSERIES_COMPAT_wolfssl = "${WOLFSSL_LEGACY_SERIES} ${WOLFSSL_MODERN_SERIES}"

# Now hook our dispatch includes with a global to anything in this layer so it automagically
# decides which mode we have...idiomatically Yocto, instead of having complex Python scripting
# in these things.  It's only applicable for files that aren't CORE layer version specific.
# (Which would self-select even if duplicative...)
WOLFSSL_OVERRIDE_MODE := "${@bb.utils.contains_any('LAYERSERIES_CORENAMES', '${WOLFSSL_LEGACY_SERIES}', 'legacy', 'modern', d)}"

# Block off any attempt to use meta-oe's version of the recipes- we're using OUR layer here and only it.
BBMASK += "meta-openembedded/meta-networking/recipes-connectivity/wolfssl/"

# Now, handle proper selection of things within the global .conf scopes...  Weak default 
# a WOLFSSL_PACKAGES that if you're using the "packagegroup" it forces inclusion of the 
# main recipes (like wolfclu, etc.) into your image and declares out the right behaviors
# for WolfSSL to do the right things (e.g. --enable-wolfclu for wolfclu) via PACKAGECONFIG
# declare outs so that they just turn things on right from local.conf, distro.conf or another
# layer specifying out their desired modes for all of this.  They're not features, they're
# actual packages that if you use the packagegroup helper declare out your packages you needed
# for the build you are specifying for at least WolfSSL as it's moving parts.  We presume 
# the virtual provider specified below the right ways for wolfssl, period.  Anything that
# has this in config scope (local.conf, distro.conf, etc.) can amend this accordingly.
#
# FIXME - Alias for a couple of versions the old WOLFSSL_FEATURES variable as it's
# 		  not describing what is going on here.  That way someone that's kind of
#         used to some of the old antics of the metadata can pick this right up and
#         largely leverage it on the spot.  IMAGE_INSTALL is not functional (or even
#         possible so explain yourself and make it clear what you did.) so we need
#         completely different flow than three or four different poorly documented
#         flows.
WOLFSSL_FEATURES ??= ""
WOLFSSL_PACKAGES ??= "${WOLFSSL_FEATURES}"

# Now we can specify the actual PACKAGECONFIGs for each of our provider recipes 
# that are declared out instead of convoluted includes/requires and the like.
# combined with our wolfssl-packagegroup listening to and using that above
# varible, you can actually drive the right knobs for what WolfSSL's support
# for things is supposed to be.  Consistently and in a Yocto Idiomatic way.
require ${LAYERDIR}/conf/packageconfig-${WOLFSSL_OVERRIDE_MODE}.conf

# Weak default preferred providers for wolf libraries. These can be overridden 
# by local.conf or distro configurations as needed/desired.  We just need to
# properly gear-shift this based off of distrooverrides.  If it's flagged commercial
# want to prefer that instead against this in the same manner.  And the USER
# claims it in their metadata/distro layer.  NOT in this one.  It's all gear
# shifts and pattern matchup here to do the right things.
PREFERRED_PROVIDER_virtual/wolfssl ??= "wolfssl"
PREFERRED_PROVIDER_virtual/wolfssl-native ??= "wolfssl"
PREFERRED_PROVIDER_wolfssl-virtual ??= "wolfssl"
PREFERRED_PROVIDER_wolfssh ??= "wolfssh"
PREFERRED_PROVIDER_wolfmqtt ??= "wolfmqtt"
PREFERRED_PROVIDER_wolftpm ??= "wolftpm"
PREFERRED_PROVIDER_wolfclu ??= "wolfclu"
PREFERRED_PROVIDER_wolfpkcs11 ??= "wolfpkcs11"
PREFERRED_PROVIDER_wolfssl-py ??= "wolfssl-py"
PREFERRED_PROVIDER_wolfcrypt-py ??= "wolfcrypt-py"
PREFERRED_PROVIDER_wolfprovider ??= "wolfprovider"
PREFERRED_PROVIDER_wolfengine ??= "wolfengine"
PREFERRED_PROVIDER_wolfboot ??= "wolfboot"
PREFERRED_PROVIDER_wolfhsm ??= "wolfhsm"

